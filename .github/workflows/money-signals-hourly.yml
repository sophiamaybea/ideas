name: AI Money Signals Hourly
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: money-signals-hourly
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out collector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Collect and publish signals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: engineering-intelligence
          TARGET_PATH: engineering-intelligence/dashboard/data/money-signals.json
          LOCAL_OUTPUT: /tmp/money-signals.json
        run: python3 engineering-intelligence/scraper/collect_money_signals.py
