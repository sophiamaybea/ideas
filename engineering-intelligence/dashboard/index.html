<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2ed">
<meta name="color-scheme" content="light">
<title>Engineering Intelligence / Index</title>
<meta name="description" content="A living node-map of repositories, prompts, ventures, companies, systems and learning.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#indexCard">Skip to index</a>
<div id="boot"><span class="bootDot"></span><span>ASSEMBLING INDEX</span></div>

<div id="app" hidden>
  <div class="viewport" id="viewport">
    <div class="graphViewport" id="graphViewport" aria-label="Engineering Intelligence relationship map">
      <div class="graphStage" id="graphStage">
        <svg class="edges" id="edges" viewBox="0 0 1600 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
    </div>

    <header class="microHeader">
      <button class="microBrand" id="homeBtn"><span class="statusDot"></span> ENGINEERING INTELLIGENCE</button>
      <span id="syncLabel">SYNCING</span>
    </header>

    <aside class="indexCard" id="indexCard" aria-label="Engineering Intelligence index">
      <div class="indexHead">
        <span><i class="marker circle accent"></i> INDEX</span>
        <button id="collapseIndex" aria-label="Collapse index">−</button>
      </div>
      <p class="indexIntro">A living map of what we are building, the technology underneath it, what might make money, and what reality has actually verified.</p>
      <div class="hairline"></div>
      <div id="indexSections"></div>
      <div class="indexFoot">
        <button id="resetGraph">RESET MAP</button>
        <span id="zoomReadout">100%</span>
      </div>
    </aside>

    <aside class="detailCard" id="detailCard" hidden>
      <button class="detailClose" id="detailClose" aria-label="Close detail">×</button>
      <div id="detailBody"></div>
    </aside>

    <div class="mapLegend">
      <span>DRAG TO PAN</span><span>SCROLL TO ZOOM</span><span>CLICK A NODE</span>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
